<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="msa-banner-bg-d" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="msa-mark-bg-d" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="msa-ring-d" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="msa-orbit-d" x1="820" y1="30" x2="1060" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="msa-glow-d" cx="940" cy="140" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#msa-banner-bg-d)" stroke="#312E81" stroke-width="1.5"/>
  <circle cx="940" cy="140" r="150" fill="url(#msa-glow-d)"/>

  <!-- Brand Mark -->
  <g transform="translate(56, 44)">
    <rect width="64" height="64" rx="14" fill="url(#msa-mark-bg-d)" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="18" stroke="url(#msa-ring-d)" stroke-width="2.2" stroke-opacity="0.9"/>
    <ellipse cx="32" cy="32" rx="9" ry="18" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.55"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="#818CF8" stroke-width="1.6" stroke-opacity="0.55"/>
    <line x1="20" y1="21" x2="32" y2="32" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="45" y1="22" x2="32" y2="32" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="40" y2="46" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
    <circle cx="45" cy="22" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="46" r="3.5" fill="#34D399"/>
    <circle cx="32" cy="32" r="4.5" fill="#F8FAFC" stroke="#1E1B4B" stroke-width="1.5"/>
  </g>

  <!-- Title & Tagline -->
  <text x="56" y="152" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em">macro-sector-agent</text>
  <text x="56" y="186" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500">Top-down US equity research — finding forgotten industries &amp; separating cycle from decay</text>

  <!-- Tech Pill -->
  <rect x="56" y="210" width="388" height="28" rx="14" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="72" y="228.5" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.06em">PYTHON 3.12 · UV · DETERMINISTIC L0–L4 · L3 LLM</text>

  <!-- Orbital Macro Sector Nodes Artwork -->
  <g transform="translate(940, 140)">
    <circle cx="0" cy="0" r="102" stroke="#818CF8" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="76" stroke="url(#msa-orbit-d)" stroke-width="2" stroke-opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="38" ry="76" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.45"/>
    <ellipse cx="0" cy="0" rx="76" ry="28" stroke="#818CF8" stroke-width="1.4" stroke-opacity="0.4"/>

    <!-- Spokes -->
    <line x1="-68" y1="-44" x2="0" y2="0" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="72" y1="-36" x2="0" y2="0" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="48" y1="68" x2="0" y2="0" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-54" y1="58" x2="0" y2="0" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="8" y1="-82" x2="0" y2="0" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.65"/>

    <!-- Outer Nodes -->
    <circle cx="-68" cy="-44" r="10" fill="#38BDF8" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="72" cy="-36" r="11" fill="#F59E0B" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="48" cy="68" r="9.5" fill="#34D399" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="-54" cy="58" r="7.5" fill="#818CF8" stroke="#0F172A" stroke-width="2"/>
    <circle cx="8" cy="-82" r="6.5" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="14" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#1E1B4B"/>
  </g>
</svg>
