# 케이스 스터디 표 — 예시 · 스키마 정본 (`state/cases/cases.yaml` 의 형식)
#
# 용도: `docs/07-portfolio.md` §2.4 C1-(ii) 의 시나리오 손실
#       L_i = max(과거 유사 국면 최대 낙폭, 케이스 스터디 **사망 사례** 낙폭 × 0.5)
#       의 둘째 항이 이 표에서 나온다. 로더: `src/msa/l5/inputs.py` `load_cases`.
#
# ⚠ 이 파일은 **예시**다. 아래 11행은 `docs/04-value-trap.md` §1 표의 사례를 자리표시자로 옮긴 것이며
#   전부 `verified: false` · `sources: []` 다. 낙폭 숫자는 04 §1 표의 "이후" 열을 그대로 적은 것이지
#   1차 출처로 대조한 값이 아니다. **L_i 에 쓰이려면 행이 다음을 전부 만족해야 한다:**
#     type: death · verified: true · sources ≥ 1 (url 필수) · drawdown_peak_to_trough not null
#   출처 없는 낙폭은 예산 제약의 숫자가 되지 않는다 (CLAUDE.md §3). 사례 6건(04 §5) 작성은 별도
#   리서치 산출물이며, 작성되면 `state/cases/cases.yaml` 에 verified: true 로 들어간다.
#
# 필드
#   id                        영구 불변 문자열
#   name_ko                   표기용
#   type                      cycle | death   — L_i 에는 death 만 쓴다. cycle 은 few-shot(M7)·감각 보정용
#   theme_ids                 이 사례가 적용되는 state/themes.yaml 테마 id (0개 이상)
#   clusters                  또는 correlation_cluster 로 넓게 적용 (0개 이상). 매칭은 theme_ids 우선
#   drawdown_peak_to_trough   고점→저점 낙폭, 양수 비율 (0,1]. 모르면 null
#   peak_date / trough_date   YYYY-MM 또는 YYYY-MM-DD (문자열)
#   verified                  true 면 sources 가 비어 있을 수 없다 (로더가 거부)
#   sources                   [{url, title, date}] — url 필수
#   notes                     자유 서술 (판정 시점 5축 값은 docs/cases/<id>.md 로 간다)
#
# 여러 행이 한 테마에 맞으면 낙폭이 가장 큰 행(보수적)을 쓰고 그 id 를 계획서에 출처로 적는다.

