# thesis 객체 — L3 산출물의 검증 스키마 (JSON Schema 스타일 서술)
# 규약: evidence 또는 invalidations 가 비면 저장 거부 (CLAUDE.md §3, §5)

schema_version: 1
type: object
required:
  - theme_id
  - generated_at
  - horizon_months
  - claim
  - mechanism
  - triggers
  - invalidations        # 비면 거부 — 이것이 Tier-1 스탑의 근거다
  - bear_case
  - value_trap_axes
  - cycle_confidence
  - evidence             # 비면 거부 — LLM 의 기억은 증거가 아니다

properties:

  theme_id:        {type: string, note: "state/themes.yaml 의 id. 영구 불변"}
  generated_at:    {type: date}
  supersedes:      {type: [string, "null"], note: "이전 thesis 파일. 재실행 시 diff 대상"}
  horizon_months:  {type: array, items: integer, minItems: 2, maxItems: 2}

  claim:
    type: string
    maxLength: 400
    note: "한 문장. 반증 가능해야 한다. 종목명이 등장하면 경고 (CLAUDE.md §4)"

  mechanism:
    type: string
    note: >
      인과 경로. 상관 서술 금지 — "역사적으로 함께 움직였다" 는 메커니즘이 아니다.
      왜 가격/이익이 오르는지를 공급·수요·정책의 언어로 쓴다.

  triggers:
    type: array
    minItems: 1
    items:
      required: [observable, source, by]
      properties:
        observable: {type: string, note: "관측 가능해야 한다. '심리 개선' 같은 것은 트리거가 아니다"}
        source:     {type: string}
        by:         {type: string, note: "기한. 시간 스탑과 정합해야 한다"}
        status:     {enum: [pending, met, missed], default: pending}

  invalidations:
    type: array
    minItems: 1
    items:
      required: [observable, source, action]
      properties:
        observable: {type: string}
        source:     {type: string}
        action:     {enum: [exit, halve, freeze_ladder]}
        status:     {enum: [pending, fired], default: pending}
    note: >
      freeze_ladder = 물타기만 중단하고 보유 유지. exit = 즉시 전량 청산.
      하나라도 fired 면 사다리 추가 매수 금지 (07-portfolio.md §3).

  key_uncertainties:
    type: array
    items: {type: string}
    note: "모르는 것을 아는 것으로 쓰지 않기 위한 칸. 비어 있으면 의심하라"

  bear_case:
    type: string
    note: "bear 에이전트의 최강 논지를 원문 보존. 요약 금지 — 요약은 반론을 약하게 만든다"

  value_trap_axes:
    type: object
    required: [unit_demand, capital_cycle, substitution, cost_curve, terminal_risk]
    additionalProperties:
      properties:
        verdict:       {enum: [cycle, warning, death, contested, not_applicable]}
        evidence_refs: {type: array, items: integer}
        note:          {type: string}
    note: >
      not_applicable 과 contested 는 다르다.
      not_applicable = 축을 **쓸 수 없다** (입력 자체가 없다 — 04-value-trap.md 축1 적용 가능 범위).
      contested      = 축을 썼는데 **집계 방식에 따라 판정이 뒤집힌다** (입력이 불안정하다 — 04 §3.1).
      공통점은 **둘 다 통과로 취급하지 않는다**는 것이다. 해당 축의 상태가 리포트에 표시되고,
      not_applicable 은 그 축의 가중치가 축 3 으로 이전되며 axis1_available = false 가
      key_uncertainties 에 명시된다 (04-value-trap.md 축1 적용 가능 범위).
      **확신도를 감점하지 않는다** — 04 §4 의 가감점 규칙에 해당 항목이 없고,
      04 는 이 사유로 계수를 바꾸지 않는다고 못박았다 (CLAUDE.md §1).
      contested 는 게이트가 보류되고 포트 편입이 불가하다.

    properties:

      unit_demand:
        note: >
          04-value-trap.md 축 1. 아래 필드는 §3.1 이 요구하는 산출물이며,
          이름은 04 · 02-cycle-state.md §F 에서 쓰는 이름을 그대로 쓴다.
        required: [verdict, axis1_available, unit_series_source, evidence_refs]
        properties:
          verdict:            {enum: [cycle, warning, death, contested, not_applicable]}
          evidence_refs:      {type: array, items: integer}
          note:               {type: string}

          axis1_available:
            type: boolean
            note: >
              실물 수요 시계열도 price_index 도 없으면 false → verdict: not_applicable,
              가중치를 축 3 으로 이전하고 key_uncertainties 에 axis1_available = false 를 명시한다
              (04-value-trap.md 축1 적용 가능 범위). 스위치는 themes.yaml 의 physical_ref 다.

          unit_series_source:
            enum: [physical_series, revenue_proxy, none]
            note: >
              어느 입력으로 unit_series 를 계산했는지. physical_series = 외부 실물 소비량 시계열
              (1순위, L3 supply_analyst 수집), revenue_proxy = 동일 구성원 매출 / 가격지수 (폴백).
              none = 두 입력이 모두 없어 unit_series 를 계산하지 못했다 —
              **axis1_available: false 일 때만 허용되며**(그때는 verdict 도 not_applicable 이다),
              반대로 axis1_available: true 이면 none 을 쓸 수 없다.
              required 를 axis1_available 에 종속시키지 않고 none 을 넣은 이유:
              필드를 빼면 "누락" 과 "쓸 수 없음" 이 구분되지 않아 조용한 절단이 된다
              (CLAUDE.md §2). 값으로 남겨야 리포트가 그 사실을 표시할 수 있다.
              **출처가 없으면 축 판정 불가** — CLAUDE.md §3 에 따라 이 필드가 가리키는 시계열은
              evidence_refs 로 최소 1개 reliability medium 이상의 출처에 연결돼야 하고,
              연결되지 않으면 verdict 를 낼 수 없다 (not_applicable 로 닫고 그 사실을 적는다).

          verdict_pre_ss:
            enum: [cycle, warning, death]
            note: "동일 구성원(SS) 보정 **전** 산출 — 테마 합산 매출 기준. 04 §3.1"
          verdict_post_ss:
            enum: [cycle, warning, death]
            note: "동일 구성원(SS) 보정 **후** 산출. 04 §3.1"

          axis1_contested:
            type: boolean
            default: false
            note: >
              verdict_pre_ss != verdict_post_ss 이거나 sign_split == true 이면 true.
              true 면 verdict 는 contested 이고 게이트는 보류된다 (04 §3, §3.1).
              리포트에 반드시 표시한다.

          ss_n:
            type: integer
            note: "동일 구성원 수. 표기 없으면 조용한 절단 (CLAUDE.md §2, 02-cycle-state.md §F)"
          ss_coverage:
            type: number
            minimum: 0
            maximum: 1
            note: "ss_n / t0 구성원 수"
          ma_flag:
            type: boolean
            note: >
              측정 구간에 유의미한 인수가 있었던 기업이 동일 구성원 표본에 포함되는가.
              true 면 물량에 상향 편향이 남아 있다 (04 축1 규정 5).

          unit_cagr_10y:        {type: number, note: "합산 물량의 10년 CAGR — 산업 규모의 변화"}
          unit_cagr_10y_median: {type: number, note: "기업당 중앙값 물량의 10년 CAGR — 개별 기업의 물량 추세"}
          unit_cagr_5y:         {type: number}
          sign_split:
            type: boolean
            note: >
              unit_cagr_10y 와 unit_cagr_10y_median 의 **부호가 갈리는가.**
              합산↓ 중앙값→ 은 산업 축소이지 수요 소멸이 아니다 (04 축1 규정 3) →
              그 자체가 axis1_contested 의 사유다 (04 §3.1).

  cycle_confidence:
    type: number
    minimum: 0
    maximum: 1
    note: >
      04-value-trap.md §4 의 가감점 규칙을 기계적으로 적용한 값.
      규칙 밖의 조정이 필요하면 조정 대신 key_uncertainties 에 서술한다.
      이 값이 10-validation.md 캘리브레이션의 유일한 검증 대상이다.

  evidence:
    type: array
    minItems: 1
    items:
      required: [id, claim, source_url, date, reliability]
      properties:
        id:          {type: integer}
        claim:       {type: string}
        source_url:  {type: string}
        date:        {type: date, note: "12개월 초과 시 리포트에 표시"}
        reliability: {enum: [high, medium, low]}
    note: >
      reliability: low 만으로는 축 판정 불가 — 최소 1개 medium 이상 필요.
      수치는 원문 대조 없이 high 로 등급할 수 없다.

  gate_result:
    type: object
    required: [status]
    properties:

      status:
        enum: [passed, contested, rejected]
        note: >
          3상태다. rejected = 04-value-trap.md §3 하드 게이트 자동 기각.
          contested = 게이트 **보류** (§3.1) — 기각도 통과도 아니며 referee 검토 대상이다.
          passed = 게이트를 통과했다. bool 로는 보류를 담을 수 없어 enum 으로 둔다.

      portfolio_eligible:
        type: boolean
        note: >
          status 가 contested 또는 rejected 이면 **반드시 false** 다.
          contested 는 관찰 목록에만 올라간다 (04 §3.1) — watchlist.yaml (09-operations.md §4).

      rule:
        type: string
        note: >
          **어떤 규칙으로 닫혔는지**를 04 §3 의 조항 단위로 적는다.
          예: "축1 사망 AND 축3 ∈ {경고, 사망} → 자동 기각",
          "축1 판정이 SS 보정 전후로 뒤집힘 → axis1_contested",
          "축1 사망 OR 축3 사망 → cycle_confidence 상한 0.35".

      path:
        enum: [hard_gate, conf_floor, secular_risk, rank_cutoff, human]
        note: >
          기각 대장의 경로 분류. 값은 state/rejections.yaml 의 path 열과 동일해야 한다
          (09-operations.md §4, 10-validation.md §4). 대장 쪽 형식은 그쪽이 정하며 여기서 바꾸지 않는다.

      axis_verdicts:
        type: object
        note: >
          **기각 시점의 축별 판정 스냅샷.** value_trap_axes 의 5축 verdict 를 그대로 복사한다.
          thesis 가 나중에 재실행돼 축 판정이 바뀌어도, 그때 무엇을 보고 닫았는지가 남아야
          기각 대장이 게이트의 위양성률을 집계할 수 있다 (10-validation.md §4 (a)(b)).
        properties:
          unit_demand:   {enum: [cycle, warning, death, contested, not_applicable]}
          capital_cycle: {enum: [cycle, warning, death, contested, not_applicable]}
          substitution:  {enum: [cycle, warning, death, contested, not_applicable]}
          cost_curve:    {enum: [cycle, warning, death, contested, not_applicable]}
          terminal_risk: {enum: [cycle, warning, death, contested, not_applicable]}

      reason:
        type: string
        note: "사람이 읽는 서술. 집계는 rule · path · axis_verdicts 로 하고 이 필드로 하지 않는다"

      referee_ruling:
        type: string
        note: >
          status: contested 일 때 필수. referee 가 **물량 감소가 산업 축소인지 수요 소멸인지**를
          서술한 판정 (04 §3.1, 05-agent-research.md §2). evidence_refs 를 갖추지 못하면
          서술할 수 없는 것이므로 status 는 rejected 로 닫는다 — 보류는 판단 유보이지 면제가 아니다.

      referee_evidence_refs:
        type: array
        items: integer
        note: "referee_ruling 의 근거. 비면 contested 를 유지할 수 없다 (CLAUDE.md §3)"

    note: >
      04-value-trap.md §3 하드 게이트 적용 결과. **기각도 저널에 남고 기각 대장에 적재된다**
      (10-validation.md §4, 09-operations.md §4). 스키마 검증 실패로 저장이 거부되는 것과
      게이트 기각은 다르다 — 앞은 산출물이 불완전한 것이고, 뒤는 완전한 산출물에 대한 판정이다
      (05-agent-research.md §4).
