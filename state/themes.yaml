# 테마 버킷 확정본 — M2
#
# 출처: /home/young/data/us_micro.duckdb (Sharadar). tickers 43,919행, industry 152종.
# 재현: uv run --with duckdb --with pyyaml python scripts/audit_themes.py
#
# 구성원 해석 규칙 (감사 스크립트와 동일하다)
#   0. 유니버스 = category LIKE '%Common Stock%' AND category NOT LIKE '%Preferred%'
#      (보통주·ADR 보통주·캐나다 보통주. ETF/CEF/우선주/기관보고는 테마 구성원이 아니다.)
#   1. exclude_tickers 는 해당 버킷에서 티커를 제거한다.
#   2. include_tickers 는 티커를 그 버킷에 배정하며 industry_match 배정을 덮어쓴다.
#      (한 티커가 두 버킷의 include 에 동시에 들어가면 중복 오류다.)
#   3. 나머지는 industry_match 로 배정한다. 152개 industry 라벨은 각각 정확히 한 버킷의
#      industry_match 에만 등장하므로, 이 경로에서 중복은 구조적으로 발생할 수 없다.
#   4. 'Shell Companies' 라벨(1,659종목)은 어느 버킷에도 배정하지 않는다 — SPAC/껍데기라
#      영업 실체가 없고 사이클 자체가 정의되지 않는다. 미분류 시총 계산에서 분모 밖으로 뺀다.
#      (docs/theme-coverage-audit.md 에 별도 항목으로 보고한다.)
#
# physical_ref 규약 (docs/01-theme-universe.md §2)
#   {source, symbol, kind} 객체 또는 null. kind ∈ {price, volume, nominal} — M3 에서 추가.
#   price  = 가격지수. unit_series = 동일 구성원 매출 / price (폴백 경로, docs/04 축 1).
#   volume = 실물 물량 시계열. unit_series = 그 자체 (1순위 경로).
#   nominal= 달러 표시 판매액. CPI 로 실질화해 volume 처럼 쓴다. source ∈ {etf, fred, manual}. verify: true 는 시리즈
#   가용성 미확인 표시다. null 은 "축 1(물량 추세)을 쓸 수 없다"는 선언이며 axis1_available=false
#   로 내려간다 (docs/04-value-trap.md 축 1). 값을 채우는 것은 축 1 을 쓸 수 있다는 주장이다.

schema_version: 1

defaults:
  min_constituents: 5
  index_weighting: [equal, cap]

themes:

  # ─────────────────────────────────────────────────────────────
  # Basic Materials — 광업·소재
  # ─────────────────────────────────────────────────────────────

  - id: gold_miners
    name_ko: 금광
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Gold"]
    include_tickers: []
    exclude_tickers: [SBSW]
    etf_proxy: GDX
    etf_proxy_alt: [GDXJ, RING]
    physical_ref: {source: etf, symbol: GLD, kind: price}
    correlation_cluster: precious_metals
    min_constituents: 5
    notes: >
      실측: 'Gold' 라벨 122종목(생존 51). 초안의 gold_miners 는 그대로 매칭됐다.
      exclude SBSW — Sibanye Stillwater 는 Sharadar 가 Gold 로 분류했으나 매출의 절반 이상이
      백금·팔라듐이다. pgm_miners 로 옮긴다.

  - id: silver_miners
    name_ko: 은광
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Silver"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: SIL
    etf_proxy_alt: [SILJ, SLVP]
    physical_ref: {source: etf, symbol: SLV, kind: price}
    correlation_cluster: precious_metals
    min_constituents: 5
    notes: >
      실측: 'Silver' 라벨은 6종목(생존 4)뿐이다 — min_constituents 5 미달.
      Sharadar 가 은 생산자 대부분(EXK·HL·ASM·AG 계열 일부)을 'Other Precious Metals & Mining'
      으로 보내기 때문이다. 억지로 include 하지 않았다 — 그 라벨은 pgm_miners 가 통째로 받고
      있으며, 은 단독 분리는 큐레이션 의존도를 감당 못할 만큼 키운다. 커버리지 감사에
      소표본 버킷으로 보고되며, 통계 신뢰도를 하향해 쓴다.

  - id: pgm_miners
    name_ko: 백금·팔라듐·기타 귀금속
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Other Precious Metals & Mining"]
    include_tickers: [SBSW, SWC, PALDF]
    exclude_tickers: [ATLX]
    etf_proxy: null
    etf_proxy_alt: [PPLT, PALL]
    physical_ref: {source: etf, symbol: PPLT, kind: price}
    correlation_cluster: precious_metals
    min_constituents: 5
    notes: >
      초안과 다른 점: Sharadar 에 백금·팔라듐 전용 라벨이 없다. 대신
      'Other Precious Metals & Mining'(35종목) 이 있고 여기에 PGM·은 주니어·로열티가 섞여 있다.
      이 버킷이 그 라벨을 통째로 받는다 — 즉 순수 PGM 버킷이 아니라 '기타 귀금속' 잔여 버킷이다.
      include 근거: SBSW(Gold 로 오분류), SWC/Stillwater(Uranium 으로 오분류 — 실제는 팔라듐,
      2017 피인수 폐지), PALDF(North American Palladium, 2019 피인수 폐지). 폐지 2종을 넣는 것은
      생존 편향 방지가 목적이다(docs/01 §5). exclude ATLX — Atlas Lithium 은 리튬이다.
      etf_proxy 가 null 인 이유: PPLT/PALL 은 실물 신탁이지 광산주 지수가 아니다.

  - id: rare_earth
    name_ko: 희토류·전략금속
    parent_sector: Basic Materials
    cycle_class: policy_program
    industry_match: []
    include_tickers: [MP, USAR, CRML, IMC, REA, NB, UAMY, IPX, ALM, TMC, GMTL, MCPIQ, QRM, REEMF, TASIF]
    exclude_tickers: []
    etf_proxy: REMX
    etf_proxy_alt: []
    physical_ref: null
    correlation_cluster: strategic_materials
    min_constituents: 5
    notes: >
      Sharadar 에 '희토류' industry 라벨이 없다 — 자동 매칭 불가라 include_tickers 로만 구성한다
      (docs/01 §1 규약). 구성원은 'Other Industrial Metals & Mining' 라벨 안에서 골랐고,
      MCPIQ(Molycorp, 2015 파산)·QRM·REEMF·TASIF 등 폐지 4종을 반드시 포함시켰다 —
      빼면 자기이력 백분위가 낙관 방향으로 왜곡된다. ALM(텅스텐)·UAMY(안티모니)·NB(니오븀)·
      IPX(티타늄)·TMC(심해 노듈)는 좁은 의미의 희토류가 아니라 '수출통제 대상 전략금속' 이라
      들어왔다 — cycle_class 가 commodity_supply 가 아니라 policy_program 인 이유와 같다.
      physical_ref null: NdPr 가격은 중국 고시가라 공개 시계열이 불안정하다 → 축 1 적용 불가.

  - id: lithium
    name_ko: 리튬
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: []
    include_tickers: [ALB, SQM, LAC, LAR, SLI, SGML, IONR, ELVR, ATLX, LTHM, PLL, AMLIF]
    exclude_tickers: []
    etf_proxy: LIT
    etf_proxy_alt: [BATT]
    physical_ref: {source: manual, symbol: LITHIUM_CARBONATE_CHINA_SPOT, kind: price}
    correlation_cluster: battery_materials
    min_constituents: 5
    notes: >
      초안과 다른 점: Sharadar 에 'Lithium' 라벨이 없다. 구성원이 두 라벨에 흩어져 있다 —
      ALB·SQM·LTHM 은 'Specialty Chemicals', 나머지는 'Other Industrial Metals & Mining'.
      자동 매칭이 불가능해 include 전용으로 구성했다. LTHM(Livent, 2023 Allkem 과 합병)·
      PLL(Piedmont, 2025 Sayona 와 합병)·AMLIF 등 폐지 3종 포함.
      LIT 상장 2010 — ETF 이력이 사이클 한 바퀴를 못 담는다.

  - id: uranium
    name_ko: 우라늄
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Uranium"]
    include_tickers: []
    exclude_tickers: [SWC, LEU]
    etf_proxy: URA
    etf_proxy_alt: [URNM, NLR]
    physical_ref: {source: manual, symbol: UXC_SPOT, kind: price}
    correlation_cluster: nuclear
    min_constituents: 5
    notes: >
      초안과 다른 점: parent_sector 가 Energy 가 아니라 Basic Materials 다 — Sharadar 실측이
      그렇다(themes.example.yaml 은 Energy 로 적혀 있었다). 라벨은 18종목(생존 13).
      exclude SWC(Stillwater, 팔라듐 오분류 → pgm_miners), LEU(Centrus, 농축·연료 서비스라
      광산 사이클이 아니다 → nuclear_smr).
      URA 상장 2010 — 자체 구성 지수를 1998년까지 소급하되 소급 구간을 리포트에 표시한다.

  - id: copper_miners
    name_ko: 구리
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Copper"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: COPX
    etf_proxy_alt: [CPER]
    physical_ref: {source: etf, symbol: CPER, kind: price}
    correlation_cluster: base_metals
    min_constituents: 5
    notes: >
      실측: 'Copper' 라벨 10종목(생존 6). 초안대로 매칭됐다. 표본이 얇아 FCX 단일 종목이
      시총가중 지수를 지배한다 — 동일가중 병기가 특히 중요한 버킷이다(docs/01 §6-1).

  - id: aluminum
    name_ko: 알루미늄
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Aluminum"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: null
    etf_proxy_alt: [XME]
    physical_ref: {source: fred, symbol: PALUMUSDM, kind: price, verify: true}
    correlation_cluster: base_metals
    min_constituents: 5
    notes: >
      실측: 9종목(생존 4) — min_constituents 미달. 전용 ETF 가 없어 초안대로 자체 구성이다.
      폐지 5종(RLM1/Reynolds, AMX1/Alumax, NORNQ/Noranda, PEHYY/Pechiney, ACHHY)이
      1998-2016 구간 이력을 지탱한다.

  - id: steel_iron
    name_ko: 철강·철광석
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Steel"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: SLX
    etf_proxy_alt: [XME]
    physical_ref: {source: fred, symbol: PIORECRUSDM, kind: price, verify: true}
    correlation_cluster: base_metals
    min_constituents: 5
    notes: >
      실측: 'Steel' 93종목(생존 22). 철광석 전업체 전용 라벨은 없다.

  - id: diversified_miners
    name_ko: 종합광업
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Other Industrial Metals & Mining", "Industrial Metals & Minerals"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: XME
    etf_proxy_alt: [PICK]
    physical_ref: null
    correlation_cluster: base_metals
    min_constituents: 5
    notes: >
      초안의 diversified_miners 를 유지하되 실제 라벨 두 개를 받는다.
      'Industrial Metals & Minerals'(4종목, 전원 폐지)는 벤더가 예전에 쓰던 라벨이라
      함께 넣지 않으면 과거 구간이 통째로 빠진다.
      이 버킷은 rare_earth·lithium 이 include 로 빼간 뒤의 잔여집합이다 — BHP·RIO·VALE·TECK 등
      진짜 종합광업체가 중심에 남는다. 초안 nickel_cobalt 는 여기로 흡수해 폐기했다:
      Sharadar 에 니켈·코발트 라벨이 없고, 미국 상장 순수 니켈주는 큐레이션해도
      min_constituents 를 못 채운다.
      physical_ref null: 여러 금속의 바스켓이라 단일 실물 참조가 정의되지 않는다 → 축 1 적용 불가.

  - id: coal
    name_ko: 석탄
    parent_sector: Basic Materials
    cycle_class: secular_risk
    industry_match: ["Thermal Coal", "Coking Coal"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: null
    etf_proxy_alt: []
    physical_ref: {source: fred, symbol: PCOALAUUSDM, kind: price, verify: true}
    correlation_cluster: fossil
    min_constituents: 5
    notes: >
      실측: Thermal Coal 26종목(생존 5) + Coking Coal 11종목(생존 5). 초안대로 매칭됐고
      parent_sector 는 Energy 가 아니라 Basic Materials 다(실측).
      KOL 상폐 — 자체 구성만 가능. secular_risk 는 사양 낙인이 아니라 입증 책임의 전환이며,
      docs/04 축 1 이 판정의 중심이다. physical_ref 를 채운 것은 미국 발전용 석탄 소비량이라는
      실물 시계열이 실제로 존재하기 때문이다(FRED 대체 시리즈는 verify 대상).

  - id: fertilizer_potash
    name_ko: 비료·칼륨
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Agricultural Inputs"]
    include_tickers: []
    exclude_tickers: [SQM]
    etf_proxy: MOO
    etf_proxy_alt: [VEGI]
    physical_ref: {source: fred, symbol: WPU0652, kind: price, verify: true}
    correlation_cluster: agriculture
    min_constituents: 5
    notes: >
      실측 라벨명은 'Agricultural Inputs'(64종목). exclude SQM — 매출 다수가 리튬이라
      lithium 으로 옮겼다.

  - id: lumber_paper
    name_ko: 제지·목재
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Lumber & Wood Production", "Paper & Paper Products"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: WOOD
    etf_proxy_alt: [CUT]
    physical_ref: {source: fred, symbol: WPU0811, kind: price, verify: true}
    correlation_cluster: housing_materials
    min_constituents: 5
    notes: >
      초안 한 버킷에 실제 라벨 두 개가 대응한다. 팀버 REIT(WY·RYN·PCH·CTT)는 Sharadar 가
      'REIT - Specialty' 로 분류해 reit_specialty 에 남아 있다 — 옮기지 않았다.
      REIT 는 자본구조·회계가 달라 L4 3축이 제조업체와 같은 뜻을 갖지 않는다.

  - id: specialty_chem
    name_ko: 특수화학
    parent_sector: Basic Materials
    cycle_class: inventory
    industry_match: ["Specialty Chemicals"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: XLB
    etf_proxy_alt: [IYM]
    physical_ref: null
    correlation_cluster: chemicals
    min_constituents: 5
    notes: >
      실측 186종목(생존 58). industrial_gas·coatings_adhesives·lithium 이 include 로
      빼간 뒤의 잔여집합이다.

  - id: commodity_chem
    name_ko: 범용석유화학
    parent_sector: Basic Materials
    cycle_class: commodity_supply
    industry_match: ["Chemicals"]
    include_tickers: []
    exclude_tickers: [ASPI]
    etf_proxy: XLB
    etf_proxy_alt: []
    physical_ref: {source: fred, symbol: WPU061, kind: price, verify: true}
    correlation_cluster: chemicals
    min_constituents: 5
    notes: >
      초안의 '범용석유화학' 에 대응하는 실제 라벨은 'Chemicals'(36종목) 이다 —
      DOW·LYB(LYB 는 Specialty 라벨)·CE·HUN·MEOH 등. exclude ASPI(동위원소 농축 → nuclear_smr).

  - id: industrial_gas
    name_ko: 산업가스
    parent_sector: Basic Materials
    cycle_class: secular_growth
    industry_match: []
    include_tickers: [LIN, APD, ARG]
    exclude_tickers: []
    etf_proxy: null
    etf_proxy_alt: [XLB]
    physical_ref: null
    correlation_cluster: chemicals
    min_constituents: 5
    notes: >
      Sharadar 에 산업가스 라벨이 없다 — LIN·APD 는 'Specialty Chemicals', ARG(Airgas,
