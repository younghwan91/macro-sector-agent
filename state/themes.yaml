    min_constituents: 5
    notes: >
      실측 라벨명은 'Building Materials'(48종목, Basic Materials 섹터). MLM·VMC·CX·EXP 등.
      physical_ref 는 시멘트 산업생산 지수 — 금액이 아니라 물량이라 축 1 에 바로 쓰인다.

  - id: hvac_building
    name_ko: HVAC·빌딩제품
    parent_sector: Basic Materials
    cycle_class: capex_program
    industry_match: ["Building Products & Equipment"]
    include_tickers: []
    exclude_tickers: []
    etf_proxy: null
    etf_proxy_alt: [XLI, ITB]
    physical_ref: null
    correlation_cluster: building
    min_constituents: 5
