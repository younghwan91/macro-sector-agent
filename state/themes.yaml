      미국 상장 순수 산업가스는 3종목뿐이라 min_constituents 미달이 구조적이다 —
      감사에 소표본으로 보고된다. secular_growth 이므로 낙폭이 신호가 아니며(docs/01 §4),
      L1 이 이 클래스에 낮은 낙폭 가중치를 준다.

  - id: coatings_adhesives
    name_ko: 도료·접착
    parent_sector: Basic Materials
    cycle_class: inventory
    industry_match: []
    include_tickers: [SHW, PPG, RPM, AXTA, FUL]
    exclude_tickers: []
    etf_proxy: null
    etf_proxy_alt: [XLB]
    physical_ref: null
    correlation_cluster: chemicals
    min_constituents: 5
    notes: >
      전용 라벨이 없다 — 전원 'Specialty Chemicals' 안에 있다. include 전용 구성이며
      큐레이션 목록이 현재 생존 대형주 5종에 한정돼 생존 편향이 남아 있다.
      과거 폐지 구성원(Valspar 2017 피인수 등)을 M3 에서 보강할 것.

  - id: cement_aggregates
