# 거시 인과 DAG (L2) — 드라이버 26개 · 선언된 인과 엣지
#
# 규약 (CLAUDE.md §1, docs/03-macro-dag.md §1):
#   엣지의 부호·시차·강도를 데이터로 학습하지 않는다. 사람이 선언하고 근거를 쓴다.
#   데이터는 반박(§6 모순 감사)에만 쓰이며, 가중치를 조정하는 데 쓰지 않는다.
#   `channel` 이 비면 스키마 검증 실패 — 메커니즘 없는 상관은 엣지가 아니다.
#
# 테마 id 는 `state/themes.yaml` 이 정본이다. 초안(109개)으로 작성된 뒤 **확정 버킷 134개에 맞춰
# 재감사했다 (M4-134, 2026-08-23)** — `scripts/audit_dag.py` 통과, in-degree 미달 0.
# 런타임(`msa macro`, `src/msa/l2/dag.py`)도 같은 검사를 적재 시마다 다시 한다.
#
# FRED 시리즈 ID 는 `docs/08-data-contract.md` §3 표를 정본으로 썼다.
# docs/03 §2 와 docs/08 §3 의 불일치는 없었다 — 03 이 소스를 서술로만 적은 항목
# (`gold_price`, `copper_price`, `defense_outlays`)에 대해 08 의 판정(프록시/확인 필요)을 그대로 반영했다.

schema_version: 1

drivers:

  # ── 금리·통화 ──────────────────────────────────────────────────────────
  - id: real_rate_10y
    source: {provider: fred, series: DFII10}
    measure: change_6m_bp
    state_rule:
      favorable_when: "change_6m_bp < -25"
      neutral_band: [-25, 25]
    common_factor: false

  - id: term_spread
    source: {provider: fred, series: T10Y2Y}
    measure: change_6m_bp
    state_rule:
      favorable_when: "change_6m_bp > 25"      # 가팔라짐 = 역전 해소
      neutral_band: [-25, 25]
    common_factor: false

  - id: breakeven_10y
    source: {provider: fred, series: T10YIE}
    measure: change_6m_bp
    state_rule:
      favorable_when: "change_6m_bp > 15"
      neutral_band: [-15, 15]
    common_factor: false

  - id: dollar_broad
    source: {provider: fred, series: DTWEXBGS}
    measure: change_6m
    state_rule:
      favorable_when: "change_6m < -0.02"
      neutral_band: [-0.02, 0.02]
    common_factor: false

  - id: fed_policy_path
    source:
      provider: fred
      series: DFEDTARU
      note: >
        선물 곡선(시장 기대 경로)은 FRED 에 없다 (docs/08 §3). 정책 경로의 기대 부분은
        외부 소스 또는 에이전트가 채우며, state 판정은 실현된 DFEDTARU 변화로만 한다.
    measure: change_6m_bp
    state_rule:
      favorable_when: "change_6m_bp < 0"
      neutral_band: [-12.5, 12.5]
    common_factor: true          # 정책 방향은 전 테마에 같은 부호 → 횡단면 중앙값 차감

  - id: usd_liquidity
    source:
      provider: derived
      formula: "WALCL - WTREGEN - RRPONTSYD"
      note: "주기 불일치(주간/주간/일간) — 주간으로 정렬 후 계산"
    measure: change_3m
    state_rule: {favorable_when: "change_3m > 0"}
    common_factor: true

  - id: m2_growth
    source: {provider: fred, series: M2SL}
    measure: yoy
    state_rule:
      favorable_when: "yoy > 0.03"
      neutral_band: [0.0, 0.03]
    common_factor: true

  # ── 성장·산업 ──────────────────────────────────────────────────────────
  - id: industrial_production
    source: {provider: fred, series: INDPRO}
    measure: yoy_second_derivative
    state_rule:
      favorable_when: "yoy_second_derivative > 0"    # 감속의 감속
    common_factor: false
    pit_note: "개정이 크다 (docs/08 §3). 국면 판정은 개정 전 값 권장"

  - id: new_orders_mfg
    source: {provider: fred, series: AMTMNO}
    measure: change_6m
    state_rule: {favorable_when: "change_6m > 0"}
    common_factor: false

  - id: capex_orders_core
    source:
      provider: fred
      series: NEWORDER
      note: "비국방 자본재 신규수주 ex 항공. 기업 투자 사이클의 선행"
    measure: change_6m
    state_rule: {favorable_when: "change_6m > 0"}
    common_factor: false

  - id: inventory_sales
    source: {provider: fred, series: ISRATIO}
    measure: change_6m
    state_rule:
      favorable_when: "change_6m < 0"          # 재고 소진 → 재주문
    common_factor: false

  - id: housing_starts
    source: {provider: fred, series: HOUST}
    measure: change_6m
    state_rule: {favorable_when: "change_6m > 0"}
    common_factor: false

  - id: employment
    source:
      provider: fred
      series: [PAYEMS, UNRATE]
      note: "PAYEMS 3개월 평균 증가분과 UNRATE 6개월 변화의 z-score 평균"
    measure: composite_z
    state_rule:
      favorable_when: "composite_z > 0.25"
      neutral_band: [-0.25, 0.25]
    common_factor: false
    pit_note: "개정이 크다 (docs/08 §3)"

  # ── 신용·리스크 ────────────────────────────────────────────────────────
  - id: hy_spread
    source: {provider: fred, series: BAMLH0A0HYM2}
    measure: change_3m_bp
    state_rule:
      favorable_when: "change_3m_bp < -50"     # 축소 = 우호
      neutral_band: [-50, 50]
    common_factor: false
    note: >
      docs/03 §5 는 hy_spread 를 국면 4분면의 3차원 축으로도 쓴다 (확대 시 전체 스코어에
      곱셈 페널티). 그 용도와 별개로 여기서는 레버리지가 높은 테마에 개별 엣지를 갖는다.

  - id: ig_spread
    source: {provider: fred, series: BAMLC0A0CM}
    measure: change_3m_bp
    state_rule:
      favorable_when: "change_3m_bp < -25"
      neutral_band: [-25, 25]
    common_factor: false

  # ── 물가·원자재 ────────────────────────────────────────────────────────
  - id: cpi_yoy
    source: {provider: fred, series: CPIAUCSL}
    measure: yoy
    state_rule:
      favorable_when: "yoy > 0.025"            # '우호' 는 인플레 방향이라는 뜻이지 좋다는 뜻이 아니다
      neutral_band: [0.015, 0.025]
    common_factor: false
    note: "실질화 계산에도 사용. 엣지 부호가 −1 인 테마가 많다 (실질 가처분소득·투입비)"

  - id: ppi_yoy
    source: {provider: fred, series: PPIACO}
    measure: yoy
    state_rule:
      favorable_when: "yoy > 0.02"
      neutral_band: [0.0, 0.02]
    common_factor: false

  - id: oil_wti
    source: {provider: fred, series: DCOILWTICO}
    measure: change_6m
    state_rule:
      favorable_when: "change_6m > 0.10"
      neutral_band: [-0.10, 0.10]
    common_factor: false

  - id: copper_price
    source:
      provider: fred
      series: PCOPPUSDM
      fallback: {provider: etf, symbol: CPER}
      note: "docs/08 §3 — M1 에서 가용성 실측 확인 필요. 실패 시 CPER 로 폴백"
    measure: change_6m
    state_rule:
      favorable_when: "change_6m > 0.05"
      neutral_band: [-0.05, 0.05]
    common_factor: false

  - id: gold_price
    source:
      provider: etf
      symbol: GLD
      alt: [IAU]
      note: "FRED 직접 시리즈가 불안정해 ETF 프록시를 정본으로 쓴다 (docs/08 §3)"
    measure: change_6m
    state_rule:
      favorable_when: "change_6m > 0.05"
      neutral_band: [-0.05, 0.05]
    common_factor: false

  - id: nat_gas
    source: {provider: fred, series: DHHNGSP}
    measure: change_6m
    state_rule:
      favorable_when: "change_6m > 0.15"
      neutral_band: [-0.15, 0.15]
    common_factor: false
    note: >
      가격 상승이 어떤 테마엔 매출(생산자·석탄 대체·머천트 발전), 어떤 테마엔 원가
      (화학·알루미늄·비료·액화)다. 그래서 부호가 테마마다 갈린다 — 엣지별 channel 이 정본.

  # ── 외부·수동 (FRED 밖) ────────────────────────────────────────────────
  - id: china_credit_impulse
    source:
      provider: manual
      note: "PBoC 사회융자총량(TSF) 12개월 변화 / GDP. 월 1회 수동/에이전트 갱신"
    measure: level
    state_rule:
      favorable_when: "level > 0"
      neutral_band: [-0.005, 0.005]
    common_factor: false

  - id: china_property
    source:
      provider: manual
      note: "중국 주택 착공·판매 면적 YoY. 월 1회 갱신 (docs/08 §3 — FRED 에 없음)"
    measure: yoy
    state_rule:
      favorable_when: "yoy > 0"
      neutral_band: [-0.03, 0.03]
    common_factor: false

  - id: defense_outlays
    source:
      provider: fred
      series: FDEFX
      note: >
        분기 시리즈. docs/08 §3 — M1 에서 실측 확인 필요. 예산안(NDAA·보충예산)은
        에이전트가 이벤트로 보태되 state 판정은 집행 실적(FDEFX)으로 한다
    measure: yoy
    state_rule:
      favorable_when: "yoy > 0.03"
      neutral_band: [0.0, 0.03]
    common_factor: false

  - id: hyperscaler_capex
    source:
      provider: sharadar_derived
      formula: "sum(capex) over [MSFT, GOOGL, AMZN, META, ORCL], TTM"
      note: >
        SF1 ARQ 에서 직접 합산한다. 재무제표라 늦고(분기말 +4~8주) 정확하다.
        시점은 발주처 가이던스(catalyst_analyst)가 주되, state 는 재무제표로만 판정한다
        (docs/03 §2). 가이던스와 재무제표가 어긋나면 리포트에 표시한다
    measure: yoy
    state_rule:
      favorable_when: "yoy > 0.10"
      neutral_band: [0.0, 0.10]
    common_factor: false

  - id: policy_events
    source:
      provider: agent
      note: >
        IRA·CHIPS·IIJA·관세·수출통제·원전 승인·약가 규제 등의 이벤트 캘린더.
        시계열이 아니라 날짜 목록이라 state_rule 이 다른 드라이버와 다르다 (docs/08 §3)
    measure: event_window
    state_rule:
      favorable_when: "직전 12개월 안에 해당 테마에 유리한 확정 이벤트가 있고, 불리한 확정 이벤트가 없다"
      note: >
        테마별로 판정이 갈리는 유일한 드라이버다. 다른 드라이버는 state 가 스칼라 하나지만
        policy_events 는 (테마, 이벤트) 쌍으로 판정된다. 엣지의 sign 은 '해당 테마에
        유리한 정책이 나왔을 때의 방향'을 뜻하며, 규제 리스크 테마는 sign = −1 로 적는다
    common_factor: false

# ═══════════════════════════════════════════════════════════════════════════
# 엣지
#
# 완료 기준은 개수가 아니라 조건이다 (docs/11-roadmap.md M4):
#   모든 테마가 최소 2개의 입력 엣지를 갖는다. 공통 인자(common_factor: true)
#   엣지는 이 하한에 세지 않는다 — 전 테마에 같은 부호라 상대 순위를 만들지 않기 때문이다.
#
# 부호 규약: sign = +1 은 '드라이버 값 상승 → 테마 우호', −1 은 '상승 → 역풍'.
#   드라이버의 state_rule(favorable_when)이 어느 방향을 +1 로 놓는지와는 독립이다.
#   tailwind 계산(docs/03 §4)은 state(from) ∈ {−1,0,+1} 에 sign 을 곱한다.
# ═══════════════════════════════════════════════════════════════════════════

edges:

  # ───────────────────────────────────────────────────────────────────────
  # dollar_broad — 달러
  # ───────────────────────────────────────────────────────────────────────
  # M4-134: nickel_cobalt → diversified_miners (흡수 폐기, 이미 목록에 있어 제거)
  - from: dollar_broad
    to: [gold_miners, silver_miners, pgm_miners, copper_miners, steel_iron, aluminum,
         diversified_miners, lithium, uranium, coal, fertilizer_potash]
    sign: -1
    lag_months: [0, 3]
    strength: strong
    channel: >
      달러 표시 원자재 가격의 역수 관계에 더해, 비미국 생산자의 원가가 현지통화이므로
      달러 약세 시 매출은 달러·원가는 현지통화로 마진이 이중 확대된다.
      광업은 고정비 비중이 커서 가격 변화가 마진에 레버리지로 증폭된다.
    evidence: "1971-1980, 2001-2011, 2019-2020, 2024-2026 국면에서 일관"
    observable: "DTWEXBGS 6개월 변화 < -2%"
    contradicts_when: >
      달러와 금이 동반 강세면 통화체계 신뢰 훼손(안전자산 동반 매수) 국면이다.
      이 엣지로 설명되지 않으므로 별도 논지가 필요 — 자동 점수에서 제외 플래그.
    contradicts_rule:            # 위 서술의 기계 판독형 (런타임 모순 감사용 — 의미 추가 없음)
      all_of:
        - {driver: dollar_broad, state: 1}
        - {driver: gold_price, state: 1}

  - from: dollar_broad
    to: [oil_gas_ep, intl_majors, oil_services, lumber_paper]
    sign: -1
    lag_months: [0, 3]
    strength: moderate
    channel: >
      달러 표시 가격 경로는 금속과 같으나, 이들은 원가도 상당 부분 달러(미국 내 조업·
      미국 임금)라 이중 확대가 약하다. 국제 메이저는 비달러 원가 비중이 높아 더 민감하다.
    evidence: "2014-2016 달러 급등 + 유가 붕괴 동반, 2020-2021 반대 국면"
    observable: "DTWEXBGS 6개월 변화 < -2%"

  # M4-134: ag_machinery → construction_machinery (DE·AGCO·CNH 가 합쳐진 버킷. 채널의 '농기계' 는
  #   그 버킷의 농업 장비 부분에만 해당하고 건설 장비(CAT)에는 해당 없음 — 강도는 그대로 둔다)
  - from: dollar_broad
    to: [agribusiness, construction_machinery]
    sign: -1
    lag_months: [3, 9]
    strength: moderate
    channel: >
      달러 약세는 미국 곡물의 수출 가격 경쟁력을 높여 수출 물량과 농가 소득을 올린다.
      농가 소득이 장비 교체 주기의 자금원이므로 농기계는 한 분기 더 늦게 반응한다.
    evidence: "2007-2008, 2010-2012 곡물 수출 호황기의 농가 소득·장비 수요"
    observable: "DTWEXBGS 6개월 변화 < -2% 이고 곡물 수출 검사량이 전년 대비 증가"

  # M4-134: +consumer_electronics(AAPL·SONY 해외 매출) +pharma_generic(TEVA·VTRS) +travel_booking(BKNG·TCOM)
  - from: dollar_broad
    to: [pharma_large, food_beverage, household_products, alcohol,
         consumer_electronics, pharma_generic, travel_booking]
    sign: -1
    lag_months: [0, 6]
    strength: weak
    channel: >
      해외 매출 비중이 40~60% 대인 미국 상장 대형주라, 달러 약세는 환산 매출과
      보고 이익을 직접 밀어올린다. 실물 수요 경로가 아니라 순수 환산 경로다.
    evidence: "2017, 2020-2021 달러 약세 구간의 다국적 소비재 EPS 환산 기여"
    observable: "DTWEXBGS 6개월 변화 < -2%"
    contradicts_when: >
      환헤지 비중이 높은 기업은 1~2년 지연되어 나타난다. 환산 기여는 일회성이라
      추세가 아니라 레벨 시프트로 봐야 한다.

  - from: dollar_broad
    to: [apparel_footwear]
    sign: +1
    lag_months: [3, 9]
    strength: weak
    channel: >
      매출은 거의 전부 미국 내 달러인데 소싱 원가는 아시아 생산이라, 달러 강세는
      매입원가(달러 환산)를 낮춰 총마진을 넓힌다. 다른 소비재와 부호가 반대인 이유가 이것이다.
    evidence: "2014-2015 달러 강세 구간의 소싱 마진 확대"
    observable: "DTWEXBGS 6개월 변화 > +2%"
    contradicts_when: >
      달러 강세가 신흥국 수요 위축이나 관세와 동반하면 매출 경로가 마진 경로를 압도한다.

  # ───────────────────────────────────────────────────────────────────────
  # real_rate_10y — 실질금리
  # ───────────────────────────────────────────────────────────────────────
  - from: real_rate_10y
    to: [gold_miners, silver_miners, pgm_miners]
    sign: -1
    lag_months: [0, 2]
    strength: strong
    channel: "무이자 자산 보유의 기회비용. 실질금리가 곧 금의 캐리 코스트이며, 광업주는 금가격에 레버리지된다"
    evidence: "2003-2011, 2019-2020, 2024-2026"
    observable: "DFII10 6개월 변화 < -25bp"
    contradicts_when: >
      2022년 이후 중앙은행 매수와 지정학 수요로 실질금리 상승 국면에서도 금이 오른 구간이 있다.
      모순 감사에서 36개월 창을 특히 주시할 엣지.

  - from: real_rate_10y
    to: [biotech_clinical]
    sign: -1
    lag_months: [0, 3]
    strength: strong
    channel: >
      임상단계 기업은 현금흐름이 전부 원거리라 할인율 민감도가 극단적이고,
