- evidence_id: 17
  resolved_by: human+claude
  date: '2026-08-29'
  verdict: refuted
  note: '**403 을 뚫고 원문을 읽었다 — 판정이 뒤집힌다.** 앞 기록(unresolvable)은 남긴다.

    확인된 것: ''safe harbor threshold, from its current rate of 6 percent to 3.5 percent,
    for states that expanded Medicaid eligibility under the Affordable Care Act''
    · ''0.5 percentage points per year''.

    **틀린 것 — claim 의 연도가 원문과 다르다.** 원문은 ''beginning in 2028 … until they reach the
    new lower limit of 3.5 percent by 2032'' 인데 claim 은 ''2027~2031년'' 이라고 적었다. 시작·종료가
    각각 한 해씩 어긋난다.

    **없는 것 둘:** ''$340B'' 가 문서에 없다 (문서의 금액은 $900B·$225.7B·$226B·$37B·$3.6B·$600M·$1.8M).
    ''120만 명'' 도 없다 (문서의 인원은 1.1 million·2.4 million). claim 의 두 수치는 원문 근처 값들과 닮았으나
    원문에 없는 값이다.

    ''40개 주+DC'' 도 문서에 없다 — 원문은 ''states that expanded Medicaid eligibility'' 라고만
    쓴다.'
  supersedes: true
