theme: silver_miners
asof: '2026-08-29'
unit: troy oz
horizon_years: 4
demand:
  verdict: expanding
  drivers:
  - name: 태양광(PV) 전지용 은 페이스트 수요 — 단, 셀당 은 사용량 축소(thrifting)와 설치용량 확대가 상충
    direction: up
    magnitude: 2024년 PV향 은 소비 약 230백만 온스(전년비 +25%)까지 급증했으나, 가격 급등에 따른 셀당 은 함량 절감(thrifting)으로
      2025년 186.6백만 온스(-6%), 2026년 약 151백만 온스(-19%)로 2년 연속 감소 전망. 다만 태양광 설치용량 자체는
      2030년까지 연 17% 성장이 예상되어, 기관 간에는 2030년 PV 수요가 300백만 온스를 재돌파할 것이라는 전망과 지속적 thrifting으로
      하향 안정될 것이라는 전망이 공존함
    evidence_ids:
    - 2
    - 6
  - name: 자동차(EV·ICE) 전장용 은 수요
    direction: up
    magnitude: 자동차향 은 수요 2025~2031년 연평균 3.4% 성장, 2031년 약 94백만 온스 도달 전망. EV 1대당 은 함량(0.8~1.6oz)이
      ICE 대비 1.6~2.2배로, EV가 2027년경 ICE를 제치고 자동차 은 수요의 주력이 되며 2031년 전체 자동차향 수요의 59%
      차지 전망
    evidence_ids:
    - 7
  - name: 투자용 코인·바(지금) 수요
    direction: up
    magnitude: 2026년 코인·순바 수요 전년비 +18% 증가, 257.6백만 온스로 전망(World Silver Survey 2026)
    evidence_ids:
    - 1
  - name: 전자·반도체·데이터센터용 은 수요
    direction: up
    magnitude: 반도체향 은 소비 2030년까지 약 23백만 온스 규모로 확대 전망, AI 데이터센터 전력수요 급증(2023년 대비 2030년
      165% 증가 전망)이 관련 전자부품 수요를 뒷받침
    evidence_ids:
    - 7
  cagr_pct: null
supply:
  verdict: constrained
  rigidity:
  - kind: byproduct
    note: 2025년 기준 전 세계 은 광산생산의 약 74%가 연·아연·구리·금 채굴의 부산물로 나오며, 순수 은 전문광산(primary)
      비중은 약 26~28%에 불과. 은 생산량이 은 수요·가격이 아니라 타 금속(구리·아연·금 등)의 채굴 경제성에 종속되어, 은 가격이 올라도
      공급이 즉각 반응하지 않는 구조적 경직성 존재
    evidence_ids:
    - 3
  - kind: resource_depletion
    note: 멕시코·인도·러시아·볼리비아·카자흐스탄·페루 등 주요 생산국에서 노후 광산 폐광이 이어지며, 2026~2030년 광산생산은 연평균
      -0.9% 감소해 2030년 901백만 온스로 예상(2025년 846.6백만 온스 대비 오히려 감소)
    evidence_ids:
    - 4
  new_capacity_3y: 확정(FID) 기준으로 향후 3년 내 글로벌 공급에 유의미한 규모를 더할 신규 프로젝트는 확인되지 않음. 검색된
    프로젝트(Sunshine Mine 재가동, La Guitarra 증설, Silver Tiger 신규 광산, MMG Khoemacau 구리·은
    증설 등)는 모두 개별 소규모이거나 2027~2028년 이후 첫 생산·아직 최종투자결정(FID) 전 단계(Sunshine은 2028년 목표로
    FID 미확정)로, 전체 844백만 온스 규모의 글로벌 생산에 비해 물량 기여가 미미함
  cagr_pct: -0.9
balance:
  verdict: tightening
  ratio_note: 공급은 2026~2030년 연평균 -0.9%로 오히려 감소 전망인 반면, 수요는 코인·바·자동차·전자 부문의 구조적 확대로
    최소한 완만한 증가세를 유지할 것으로 보여, 물량 기준 격차(연 46~80백만 온스 수준의 결손)가 2021년부터 2026년까지 6년 연속
    이어지고 있음(누적 지상재고 소진 762.1백만 온스)
  what_would_close_it:
  - 재활용(scrap) 공급 확대 — 2026년 재활용 공급이 전년비 약 7% 증가 전망되어 결손폭을 일부 상쇄
  - 고가격에 따른 PV 셀당 은 함량 추가 절감(thrifting) 가속으로 산업수요 증가율 둔화
  - 지상재고(above-ground stock) 및 ETF 보유분 추가 소진 — 6년간 762백만 온스가 이미 소진되었으나 한계가 있어 이 경로가
    무기한 지속되기는 어려움
  - 부산물 광산의 모(母)금속(구리·아연·연·금) 가격 상승에 따른 채굴량 증대가 부수적으로 은 생산을 늘릴 가능성
  - 은 가격 상승 지속 시 신규 전문(primary) 광산에 대한 투자·개발 유인 확대(단, 통상 개발 리드타임이 수년 소요되어 이번 3~5년
    지평 내 반영은 제한적)
  invalidations:
  - PV 업계의 은 함량 thrifting이 예상보다 급격히 진행되어 2026년 -19% 감소세가 구조적 추세로 굳어질 경우, 산업수요 증가율이
    공급 감소율을 밑돌아 균형이 완화(loosening)될 수 있음
  - 코인·바 등 투자수요가 가격 급등 후 통상적으로 나타나는 수요 위축(demand destruction)을 겪을 경우 총수요 증가율이 꺾일 수
    있음
  - 구리·아연·금 가격 강세로 부산물 광산의 증산이 예상보다 빠르게 이뤄질 경우 공급 CAGR이 플러스로 전환될 수 있음
  - 지상재고·ETF 보유분에 대한 실제 가용량이 통계상 수치보다 적어(다중 청구권 문제) 결손이 통계보다 이미 더 타이트하거나, 반대로 숨겨진
    재고가 드러나 결손 규모가 과장되었을 가능성
